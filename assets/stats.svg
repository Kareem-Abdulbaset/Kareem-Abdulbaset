<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 195" width="480" height="195" role="img" aria-label="GitHub stats">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="100%" stop-color="#131A2E"/>
    </linearGradient>
    <linearGradient id="sac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="480" height="195" rx="10" fill="url(#sbg)" stroke="#243049"/>
  <rect x="0" y="0" width="480" height="3" rx="1.5" fill="url(#sac)"/>
  <text x="34" y="46" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="17" font-weight="700" fill="#58A6FF">GitHub Stats</text>
  
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.15s" fill="freeze"/>
      <circle cx="34" cy="71" r="3.5" fill="#58A6FF"/>
      <text x="48" y="76" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13" fill="#8B98B0">Repositories</text>
      <text x="234" y="76" text-anchor="end" font-family="'Segoe UI',Ubuntu,sans-serif"
            font-size="17" font-weight="700" fill="#F0F6FC">11</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.27s" fill="freeze"/>
      <circle cx="258" cy="71" r="3.5" fill="#58A6FF"/>
      <text x="272" y="76" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13" fill="#8B98B0">Total Commits</text>
      <text x="458" y="76" text-anchor="end" font-family="'Segoe UI',Ubuntu,sans-serif"
            font-size="17" font-weight="700" fill="#F0F6FC">74</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.39s" fill="freeze"/>
      <circle cx="34" cy="125" r="3.5" fill="#58A6FF"/>
      <text x="48" y="130" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13" fill="#8B98B0">Stars Earned</text>
      <text x="234" y="130" text-anchor="end" font-family="'Segoe UI',Ubuntu,sans-serif"
            font-size="17" font-weight="700" fill="#F0F6FC">0</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.51s" fill="freeze"/>
      <circle cx="258" cy="125" r="3.5" fill="#58A6FF"/>
      <text x="272" y="130" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13" fill="#8B98B0">Followers</text>
      <text x="458" y="130" text-anchor="end" font-family="'Segoe UI',Ubuntu,sans-serif"
            font-size="17" font-weight="700" fill="#F0F6FC">0</text>
    </g>
</svg>