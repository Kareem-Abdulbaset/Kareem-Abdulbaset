<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Kareem Abdulbaset">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="55%" stop-color="#0F1631"/>
      <stop offset="100%" stop-color="#160F35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 L0 0 0 34" fill="none" stroke="#5B7BB5" stroke-width="0.5" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1000" height="250" fill="url(#bg)"/>
  <rect width="1000" height="250" fill="url(#grid)"/>
  
    <circle cx="130" cy="60" r="90" fill="#3B82F6" opacity="0.20" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 40 25; 0 0" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="870" cy="190" r="105" fill="#8B5CF6" opacity="0.20" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -45 -30; 0 0" dur="14s" repeatCount="indefinite" />
    </circle>
    <circle cx="640" cy="40" r="70" fill="#06B6D4" opacity="0.20" filter="url(#soft)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -30 35; 0 0" dur="9s" repeatCount="indefinite" />
    </circle>

  <text x="500" y="98" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif"
        font-size="52" font-weight="800" fill="#F0F6FC" filter="url(#glow)">Kareem Abdulbaset</text>

  
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="10.8s"
        keyTimes="0.000;0.000;0.020;0.283;0.323;1.000" repeatCount="indefinite" />
      <text x="500" y="152" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif"
            font-size="23" font-weight="600" fill="#7DD3FC" clip-path="url(#typeClip0)">Front-End Developer</text>
    </g>
    <clipPath id="typeClip0">
      <rect x="0" y="130" height="32" width="0">
        <animate attributeName="width" values="0;0;1000;1000" dur="10.8s"
          keyTimes="0;0.000;0.090;1"
          repeatCount="indefinite" />
      </rect>
    </clipPath>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="10.8s"
        keyTimes="0.000;0.333;0.353;0.617;0.657;1.000" repeatCount="indefinite" />
      <text x="500" y="152" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif"
            font-size="23" font-weight="600" fill="#7DD3FC" clip-path="url(#typeClip1)">React &amp; Next.js Engineer</text>
    </g>
    <clipPath id="typeClip1">
      <rect x="0" y="130" height="32" width="0">
        <animate attributeName="width" values="0;0;1000;1000" dur="10.8s"
          keyTimes="0;0.333;0.423;1"
          repeatCount="indefinite" />
      </rect>
    </clipPath>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="10.8s"
        keyTimes="0.000;0.667;0.687;0.950;0.990;1.000" repeatCount="indefinite" />
      <text x="500" y="152" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif"
            font-size="23" font-weight="600" fill="#7DD3FC" clip-path="url(#typeClip2)">TypeScript Enthusiast</text>
    </g>
    <clipPath id="typeClip2">
      <rect x="0" y="130" height="32" width="0">
        <animate attributeName="width" values="0;0;1000;1000" dur="10.8s"
          keyTimes="0;0.667;0.757;1"
          repeatCount="indefinite" />
      </rect>
    </clipPath>

  <text x="500" y="192" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif"
        font-size="14.5" fill="#8B98B0">I turn ideas into fast, accessible web applications.</text>

  <rect x="0" y="246" width="1000" height="4" fill="url(#accent)"/>
</svg>