<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Kareem Abdulbaset — Front-End Engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070F"/><stop offset="50%" stop-color="#0B1026"/><stop offset="100%" stop-color="#150C2E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2440" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#0E1428" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A3A63"/><stop offset="100%" stop-color="#141B33"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="screenClip"><polygon points="505.0,96.0 936.0,132.0 936.0,248.0 505.0,300.0"/></clipPath>
  </defs>

  <rect width="1000" height="380" fill="url(#sky)"/>

  <!-- هالات ضوء بتتنفّس -->
  <circle cx="760" cy="150" r="150" fill="#4F46E5" opacity="0.28" filter="url(#blur40)">
    <animate attributeName="opacity" values="0.28;0.44;0.28" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="300" r="130" fill="#0EA5E9" opacity="0.20" filter="url(#blur40)">
    <animate attributeName="opacity" values="0.20;0.34;0.20" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- ══ النص التسويقي ══ -->
  <g>
    <rect x="52" y="74" width="152" height="26" rx="13" fill="#0EA5E9" opacity="0.13" stroke="#0EA5E9" stroke-opacity="0.45"/>
    <circle cx="70" cy="87" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="82" y="91" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="600" fill="#7DD3FC">AVAILABLE FOR WORK</text>

    <text x="52" y="140" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="38" font-weight="800" fill="#F8FAFC">Kareem Abdulbaset</text>
    <text x="52" y="175" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="19" font-weight="600" fill="#8B5CF6">Front-End Developer</text>

    <text x="52" y="212" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13.5" fill="#94A3B8">I build interfaces that load fast, scale</text>
    <text x="52" y="232" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="13.5" fill="#94A3B8">cleanly, and feel effortless to use.</text>

    <!-- مقاييس -->
    <g transform="translate(52,262)">
      
      <g transform="translate(0,0)">
        <text x="0" y="16" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="21" font-weight="800" fill="#F8FAFC">11</text>
        <text x="0" y="32" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="1">PROJECTS</text>
      </g>
      <g transform="translate(108,0)">
        <text x="0" y="16" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="21" font-weight="800" fill="#F8FAFC">74</text>
        <text x="0" y="32" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="1">COMMITS</text>
      </g>
      <g transform="translate(216,0)">
        <text x="0" y="16" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="21" font-weight="800" fill="#F8FAFC">76%</text>
        <text x="0" y="32" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="1">TYPESCRIPT</text>
      </g>
    </g>

    <!-- زرار CTA -->
    <g>
      <rect x="52" y="316" width="132" height="34" rx="17" fill="url(#cta)"/>
      <text x="118" y="338" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="12.5" font-weight="700" fill="#fff">View My Work</text>
      <rect x="196" y="316" width="112" height="34" rx="17" fill="none" stroke="#334166" stroke-width="1.4"/>
      <text x="252" y="338" text-anchor="middle" font-family="'Segoe UI',Ubuntu,sans-serif" font-size="12.5" font-weight="600" fill="#94A3B8">Contact</text>
    </g>
  </g>

  <!-- ══ الشاشة في المنظور ══ -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="6s" repeatCount="indefinite"/>

    <polygon points="505.0,300.0 505.0,96.0 492.0,109.0 492.0,313.0" fill="url(#edge)"/>
    <polygon points="505.0,300.0 936.0,248.0 923.0,261.0 492.0,313.0" fill="#0C1225"/>
    <polygon points="505.0,96.0 936.0,132.0 936.0,248.0 505.0,300.0" fill="url(#glass)" stroke="#38466E" stroke-width="1.2"/>

    <g clip-path="url(#screenClip)">
      <line x1="505.0" y1="136.8"
            x2="936.0" y2="155.2" stroke="#2B3559" stroke-width="1.2"/>
    <line x1="530.9" y1="157.8" x2="677.4" y2="161.0"
      stroke="#7DD3FC" stroke-width="1.87" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.95" dur="0.4s" begin="0.50s" fill="freeze"/>
    </line>
    <line x1="686.0" y1="174.9" x2="780.8" y2="175.5"
      stroke="#C4B5FD" stroke-width="1.69" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.95" dur="0.4s" begin="0.59s" fill="freeze"/>
    </line>
    <line x1="530.9" y1="190.4" x2="617.1" y2="189.4"
      stroke="#F0ABFC" stroke-width="1.87" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.95" dur="0.4s" begin="0.68s" fill="freeze"/>
    </line>
    <line x1="634.3" y1="203.8" x2="806.7" y2="199.0"
      stroke="#93C5FD" stroke-width="1.75" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.95" dur="0.4s" begin="0.77s" fill="freeze"/>
    </line>
    <line x1="548.1" y1="222.2" x2="737.7" y2="213.7"
      stroke="#86EFAC" stroke-width="1.85" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.95" dur="0.4s" begin="0.86s" fill="freeze"/>
    </line>
    <line x1="548.1" y1="238.2" x2="660.2" y2="231.3"
      stroke="#7DD3FC" stroke-width="1.85" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.95" dur="0.4s" begin="0.95s" fill="freeze"/>
    </line>
    <line x1="530.9" y1="255.5" x2="660.2" y2="245.4"
      stroke="#FDE68A" stroke-width="1.87" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.95" dur="0.4s" begin="1.04s" fill="freeze"/>
    </line>
    <line x1="651.5" y1="260.4" x2="772.2" y2="248.9"
      stroke="#93C5FD" stroke-width="1.73" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.95" dur="0.4s" begin="1.13s" fill="freeze"/>
    </line>
      <!-- لمعة بتعدّي على الشاشة -->
      <rect x="440" y="60" width="150" height="260" fill="url(#shine)" transform="skewX(-14)">
        <animate attributeName="x" values="420;980;420" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <circle cx="520.1" cy="119.4" r="4.2" fill="#FF5F57"/><circle cx="533.9" cy="120.2" r="4.2" fill="#FEBC2E"/><circle cx="547.7" cy="121.0" r="4.2" fill="#28C840"/>
  </g>
</svg>